[package]
name = "gym-progress"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gym_progress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
